# Baut die Edition (TEI/XML -> HTML mit XSLT/Saxon via Ant) und veröffentlicht html/ auf GitHub Pages.
# Voraussetzung (einmalig): Repo -> Settings -> Pages -> Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manueller Start über den Actions-Tab
  workflow_dispatch:

# Minimale Rechte: nur lesen + Pages deployen
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Deployments nicht abbrechen
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      ANT_OPTS: -Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build the site (ant build)
        run: ant build
      - name: Check build output
        run: |
          test -f html/index.html
          test -f html/karte.html
          test -f html/fol154r.html
          echo "HTML-Seiten: $(ls html/*.html | wc -l)"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
